<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beachside Suites — Review QR Cards</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f5ead6;
    color: #134e4a;
  }
  .controls {
    background: white;
    padding: 16px 20px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .controls h2 { margin: 0; font-size: 16px; font-weight: 600; color: #0f172a; }
  .controls .spacer { flex: 1; }
  .controls button {
    background: #0f766e;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .controls button:hover { background: #134e4a; }
  .hint { color: #64748b; font-size: 13px; }

  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 16px auto;
    background: white;
    padding: 12mm;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8mm;
  }

  .card {
    border: 1.5px dashed #cbd5e1;
    border-radius: 6mm;
    padding: 8mm 6mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: white;
  }
  .card .brand {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15pt;
    font-weight: 600;
    color: #134e4a;
    letter-spacing: 0.02em;
  }
  .card .sub {
    font-size: 8pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #64748b;
    margin: 2px 0 6mm;
  }
  .card .qr {
    width: 55mm;
    height: 55mm;
  }
  .card .qr img { width: 100%; height: 100%; display: block; }
  .card .headline {
    margin-top: 5mm;
    font-family: Georgia, serif;
    font-size: 13pt;
    color: #0f172a;
    line-height: 1.25;
  }
  .card .cta {
    margin-top: 2mm;
    font-size: 9pt;
    color: #475569;
    line-height: 1.35;
  }
  .card .cta strong { color: #0f766e; }

  @media print {
    .controls { display: none; }
    body { background: white; }
    .sheet { box-shadow: none; margin: 0; padding: 0; }
  }
</style>
</head>
<body>

<div class="controls">
  <h2>Beachside Suites — Review QR Cards</h2>
  <span class="hint">Run <code>generate-qrs.sh</code> first. Prints 6 identical cards per page — duplicate the page or print 3 copies for 15+ rooms.</span>
  <span class="spacer"></span>
  <button onclick="window.print()">🖨 Print / Save as PDF</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
  // 6 identical cards per A4 sheet (2 cols × 3 rows).
  // For 15 suites, print 3 copies = 18 cards (3 spares).
  const CARDS_PER_SHEET = 6;
  const sheet = document.getElementById('sheet');
  for (let i = 0; i < CARDS_PER_SHEET; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="brand">Beachside Suites</div>
      <div class="sub">Aruba</div>
      <div class="qr"><img src="qr-codes/review-qr.png" alt="Scan to leave a review"></div>
      <div class="headline">How was your stay?</div>
      <div class="cta">Scan to share your experience<br/><strong>It takes 30 seconds 🌴</strong></div>
    `;
    sheet.appendChild(card);
  }
</script>

</body>
</html>
